services:

    database:
      image: postgres:18-alpine
      environment:
        POSTGRES_DB: ${POSTGRE_DB}
        POSTGRES_USER: ${POSTGRE_USER}
        POSTGRES_PASSWORD: ${POSTGRE_PASSWORD}
      ports:
        - "5432:5432"
      networks:
        - dashboard_network
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
        interval: 5s
        timeout: 5s
        retries: 5

    backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: backend
      environment:
        POSTGRES_DB: ${POSTGRE_DB}
        POSTGRES_USER: ${POSTGRE_USER}
        POSTGRES_PASSWORD: ${POSTGRE_PASSWORD}
      ports:
      - "8000:8000"
      depends_on:
        database:
          condition: service_healthy
      volumes:
        - ./backend:/app
      restart: unless-stopped
      networks:
        - dashboard_network

    frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: frontend
      ports:
        - "5173:5173"
      volumes:
        - ./frontend:/app
        - /app/node_modules
      restart: unless-stopped
      networks:
        - dashboard_network

networks:
  dashboard_network:
    driver: bridge
