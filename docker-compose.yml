services:

    database:
      image: postgres:18-alpine
      environment:
        POSTGRES_DB: ${POSTGRE_DB}
        POSTGRES_USER: ${POSTGRE_USER}
        POSTGRES_PASSWORD: ${POSTGRE_PASSWORD}
      networks:
        - dashboard_network
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
        interval: 5s
        timeout: 5s
        retries: 5
      volumes:
        - postgres_data:/var/lib/postgresql/       

    backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: backend
      environment:
        SECRET_KEY : ${SECRET_KEY}
        ALLOWED_HOSTS: ${ALLOWED_HOSTS}
        POSTGRES_DB: ${POSTGRE_DB}
        POSTGRES_USER: ${POSTGRE_USER}
        POSTGRES_PASSWORD: ${POSTGRE_PASSWORD}
      expose:
        - "8000"
      depends_on:
        database:
          condition: service_healthy
      volumes:
        - static_files:/app/staticfiles
      restart: unless-stopped
      command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
      networks:
        - dashboard_network
    
    nginx:
      image: nginx:stable-alpine3.24
      ports:
        - "8080:80"
        - "443:443"
      networks:
        - dashboard_network
      depends_on:
        - backend
        - frontend
      volumes:
        - static_files:/staticfiles:ro
        - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      
    etl:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: etl
      environment:
        POSTGRES_DB: ${POSTGRE_DB}
        POSTGRES_USER: ${POSTGRE_USER}
        POSTGRES_PASSWORD: ${POSTGRE_PASSWORD}
      networks:
        - dashboard_network
      volumes :
        - .:/app

    frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: frontend
      expose:
        - "5173"
      restart: unless-stopped
      networks:
        - dashboard_network

volumes:
  postgres_data:
  static_files:

networks:
  dashboard_network:
    driver: bridge
